# makepkg's download agents (same as Arch's makepkg.conf), except that http and
# https go through makepkg-download so that an unavailable or stalled source
# server fails the build instead of hanging it.
DLAGENTS=('file::/usr/bin/curl -qgC - -o %o %u'
          'ftp::/usr/bin/curl -qgfC - --ftp-pasv --retry 3 --retry-delay 3 -o %o %u'
          'http::/usr/local/bin/makepkg-download %o %u'
          'https::/usr/local/bin/makepkg-download %o %u'
          'rsync::/usr/bin/rsync --no-motd -z %u %o'
          'scp::/usr/bin/scp -C %u %o')
